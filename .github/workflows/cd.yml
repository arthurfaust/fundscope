# Entrega contínua do FundScope (PGC 3.3, 6.1, 6.4 e 9).
# Adaptado de docs/aulas/modelos/cd-modelo.yml da ONGConecta.
#
#   merge na main
#     └─ preparar ..... calcula a versão (SemVer) e constrói a imagem Docker UMA única vez
#         └─ staging .. testa a imagem candidata e marca a tag "staging" no GHCR
#             └─ producao ... AGUARDA APROVAÇÃO (Environment "production")
#                             promove a MESMA imagem para vX.Y.Z, production e latest
#                             e cria a baseline: tag Git vX.Y.Z + Release com notas e pacote
#
# Produção só acontece quando há versão nova (título feat/fix desde a última tag).
# Rollback: workflow rollback.yml, que reaponta "production" para uma versão anterior.

name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  preparar:
    name: Versão e imagem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      release: ${{ steps.versao.outputs.release }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # histórico completo: necessário para achar a última tag

      # O script usa o Node que já vem instalado no runner.
      - name: Calcular proxima versao (Conventional Commits)
        id: versao
        env:
          NOTAS_ARQUIVO: notas-release.md
        run: node scripts/proxima-versao.mjs

      - name: Login no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Build único: staging e produção usam exatamente esta imagem (sha-<commit>).
      - name: Construir e publicar imagem candidata
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          docker build \
            --label "org.opencontainers.image.version=$VERSAO" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGEM:sha-$GITHUB_SHA" .
          docker push "$IMAGEM:sha-$GITHUB_SHA"

      # Pacote anexado à Release: o código-fonte da versão e a referência da imagem.
      - name: Empacotar codigo-fonte
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
          NOME: ${{ github.event.repository.name }}-${{ steps.versao.outputs.versao }}
        run: |
          mkdir pacote
          git archive HEAD | tar -x -C pacote
          echo "$VERSAO" > pacote/VERSAO
          echo "$IMAGEM:sha-$GITHUB_SHA" > pacote/IMAGEM
          (cd pacote && zip -qr "../$NOME.zip" .)
          echo "Pacote gerado: $NOME.zip"

      - name: Guardar pacote (o MESMO vai para staging e producao)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacote
          path: |
            *.zip
            notas-release.md
          retention-days: 30

  staging:
    name: Staging
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Login no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Verificar execucao da imagem candidata
        run: docker run --rm "$IMAGEM:sha-$GITHUB_SHA"

      - name: Marcar imagem como staging (sem reconstruir)
        run: docker buildx imagetools create --tag "$IMAGEM:staging" "$IMAGEM:sha-$GITHUB_SHA"

      - name: Resumo
        env:
          VERSAO: ${{ needs.preparar.outputs.versao }}
          RELEASE: ${{ needs.preparar.outputs.release }}
        run: |
          {
            echo "## Staging: v$VERSAO"
            echo "- Imagem candidata: \`$IMAGEM:sha-$GITHUB_SHA\` (também \`$IMAGEM:staging\`)."
            echo "- Pacote com o código-fonte: seção **Artifacts** desta execução."
            if [ "$RELEASE" = "true" ]; then
              echo "- Teste a imagem e aprove o job **Produção** para criar a baseline v$VERSAO."
            else
              echo "- Sem título feat/fix desde a última tag: não haverá release nova."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  producao:
    name: Produção
    needs: [preparar, staging]
    if: needs.preparar.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Environment "production" com Required reviewers: o job PAUSA até a aprovação (PGC 6.1).
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.preparar.outputs.versao }}
    env:
      TAG: v${{ needs.preparar.outputs.versao }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Baixar pacote
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pacote
          path: entrega

      - name: Login no GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Promover imagem validada em staging (sem reconstruir)
        run: |
          docker buildx imagetools create \
            --tag "$IMAGEM:$TAG" \
            --tag "$IMAGEM:production" \
            --tag "$IMAGEM:latest" \
            "$IMAGEM:sha-$GITHUB_SHA"

      - name: Criar baseline (tag + Release com notas e pacote, PGC 9)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::notice::Tag $TAG já existe; nada a fazer."
            exit 0
          fi
          {
            cat entrega/notas-release.md
            echo
            echo "### Imagem Docker"
            echo "\`$IMAGEM:$TAG\`"
          } > notas.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          gh release create "$TAG" entrega/*.zip --title "$TAG" \
            --notes-file notas.md --verify-tag

      - name: Resumo
        run: |
          {
            echo "## Produção: $TAG"
            echo "- Imagem promovida: \`$IMAGEM:$TAG\` (também \`production\` e \`latest\`)."
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- Aprovado no Environment production; execução disparada por @$GITHUB_ACTOR."
          } >> "$GITHUB_STEP_SUMMARY"
