name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/arthurfaust/fundscope

jobs:
  deploy:
    name: Publicar imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagem
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:sha-${GITHUB_SHA} \
            .

      - name: Publicar imagem
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:sha-${GITHUB_SHA}