name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Obter codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.17"

      - name: Instalar Python
        run: uv python install

      - name: Instalar dependencias
        run: uv sync --locked --dev

      - name: Verificar formatacao
        run: uv run --locked ruff format --check .

      - name: Verificar qualidade
        run: uv run --locked ruff check .

      - name: Executar testes com cobertura
        run: >
          uv run --locked pytest tests/unit
          --cov=fundscope.validation
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Validar Docker Compose
        env:
          POSTGRES_DB: fundscope
          POSTGRES_USER: fundscope
          POSTGRES_PASSWORD: senha-descartavel-ci
          POSTGRES_PORT: "5432"
          FUNDSCOPE_IMAGE: fundscope/app:ci
        run: docker compose config --quiet

      - name: Construir imagem Docker
        run: docker build -t fundscope/app:ci .

      - name: Verificar execucao do container
        run: docker run --rm fundscope/app:ci

      - name: Verificar integracao com PostgreSQL
        env:
          COMPOSE_PROJECT_NAME: fundscope-ci
          POSTGRES_DB: fundscope
          POSTGRES_USER: fundscope
          POSTGRES_PASSWORD: senha-descartavel-ci
          POSTGRES_PORT: "5432"
          FUNDSCOPE_IMAGE: fundscope/app:ci
        run: |
          trap 'docker compose --env-file .env.example down -v' EXIT
          docker compose --env-file .env.example up -d --wait postgres
          docker compose --env-file .env.example run --rm app