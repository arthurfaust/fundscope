[project]
name = "fundscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arthurfaust", email = "arthur.f.locatelli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
fundscope = "fundscope:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
